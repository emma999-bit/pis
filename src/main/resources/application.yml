server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/coupon_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  redis:
    host: localhost
    port: 6379
    database: 0
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 5

rocketmq:
  name-server: localhost:9876
  producer:
    group: coupon-producer-group
    send-message-timeout: 3000
  consumer:
    group: coupon-consumer-group

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.example.coupon: DEBUG
